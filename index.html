<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sharkyloop</title>
  <meta name="description" content="sharkyloop on GitHub.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="sharkyloop">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sharkyloop.github.io/">
  <meta property="og:image" content="https://sharkyloop.github.io/assets/logo.jpg">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    :root {
      --ink: #2f5f85;
      --ink-soft: #5c88a8;
      --shark: #5b8db5;
      --shark-deep: #3f729c;
      --foam: #e8f6f8;
      --line: #cfe6ee;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { width: 100%; max-width: 560px; }
    h1 {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .logo {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      animation: bob 6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
    }
    .links { margin-top: 8px; }
    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      border: 2px dashed var(--line);
      border-radius: 999px;
      background: var(--foam);
      color: var(--shark-deep);
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      transition: background-color .15s, border-color .15s, color .15s;
    }
    .button:hover, .button:focus-visible {
      background: var(--shark);
      border-color: var(--shark-deep);
      color: #fff;
    }
    .button:focus-visible { outline: 3px solid var(--line); outline-offset: 3px; }
    .button svg { width: 20px; height: 20px; fill: currentColor; }
    footer {
      margin-top: 40px;
      font-size: .85rem;
      color: var(--ink-soft);
    }
  </style>
</head>
<body>
  <main>
    <h1>sharkyloop</h1>
    <picture>
      <source srcset="assets/logo.webp" type="image/webp">
      <img class="logo" src="assets/logo.jpg" width="2000" height="2000"
           alt="sharkyloop logo: a plush blue shark curled through an infinity loop">
    </picture>
    <div class="links">
      <a class="button" href="https://github.com/sharkyloop">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        sharkyloop on GitHub
      </a>
    </div>
  </main>
  <footer>&copy; sharkyloop</footer>
</body>
</html>
