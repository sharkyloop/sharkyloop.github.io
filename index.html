<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>sharkyloop</title>
  <meta name="description" content="sharkyloop on GitHub, Discord and X.">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#ffffff">
  <meta property="og:title" content="sharkyloop">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://sharkyloop.com/">
  <meta property="og:image" content="https://sharkyloop.com/assets/logo.jpg">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <style>
    :root {
      --ink: #2f5f85;
      --ink-soft: #5c88a8;
      --shark: #5b8db5;
      --shark-deep: #3f729c;
      --foam: #e8f6f8;
      --line: #cfe6ee;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", system-ui, -apple-system, "Segoe UI", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      text-align: center;
    }
    main { width: 100%; max-width: 560px; }
    h1 {
      position: absolute;
      width: 1px; height: 1px;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }
    .logo {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1;
      animation: bob 6s ease-in-out infinite;
    }
    @keyframes bob {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .logo { animation: none; }
    }
    .links {
      margin-top: 8px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }
    .button {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 12px 22px;
      border: 2px dashed var(--line);
      border-radius: 999px;
      background: var(--foam);
      color: var(--shark-deep);
      font-size: 1.05rem;
      font-weight: 700;
      text-decoration: none;
      transition: background-color .15s, border-color .15s, color .15s;
    }
    .button:hover, .button:focus-visible {
      background: var(--shark);
      border-color: var(--shark-deep);
      color: #fff;
    }
    .button:focus-visible { outline: 3px solid var(--line); outline-offset: 3px; }
    .button svg { width: 20px; height: 20px; fill: currentColor; }
    footer {
      margin-top: 40px;
      font-size: .85rem;
      color: var(--ink-soft);
    }
  </style>
</head>
